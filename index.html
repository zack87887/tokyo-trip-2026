<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京家庭旅行 2026</title>
<meta name="description" content="2026/12/3～12/8 東京 6 天 5 夜・11 人家庭旅行行程">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="🇯🇵 東京家庭旅行｜12/3～12/8">
<meta property="og:description" content="六天行程、航班、住宿與出發前待辦，手機打開就能看。">
<meta name="theme-color" content="#FFFCF6">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 56 L28 18 Q32 12 36 18 L58 56Z' fill='%23A8D3E6' stroke='%233E3A39' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M20 34 L28 18 Q32 12 36 18 L44 34 L38 30 L32 36 L26 30Z' fill='%23FFFCF6' stroke='%233E3A39' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --pink:#F2A497; --yellow:#F6D27A;
  --blue:#A8D3E6; --green:#B9DAA5; --card:#FFFFFF; --muted:#6F6866;
  --line:3px solid var(--ink); --thin:2px solid var(--ink);
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --lift:0 5px 0 var(--ink);
  --nav-h:60px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px; line-height:1.7; overflow-x:hidden;
}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0}
.wrap{width:100%; max-width:980px; margin:0 auto; padding:0 16px}
section{padding:22px 0; scroll-margin-top:calc(var(--nav-h) + 8px)}

/* 頂端選單 */
.topbar{position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:var(--line)}
.nav{display:flex; gap:8px; overflow-x:auto; padding:10px 16px; max-width:980px; margin:0 auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none; text-decoration:none; border:var(--thin); border-radius:999px; padding:6px 14px; background:var(--card); font-weight:700; font-size:.95rem}
.nav a:active{background:var(--yellow)}

/* 公告 */
.notice{display:flex; gap:10px; align-items:flex-start; margin:16px 0 0; border:var(--line); border-radius:var(--r-md); padding:12px 14px; background:var(--yellow); font-weight:700}
.notice[hidden]{display:none}

/* 首頁 */
.hero{padding-top:18px}
.hero-card{border:var(--line); border-radius:var(--r-lg); background:var(--card); padding:20px 18px 18px; box-shadow:var(--lift)}
.chip{display:inline-flex; align-items:center; gap:6px; border:var(--thin); border-radius:999px; padding:3px 12px; background:var(--pink); font-weight:700; font-size:.9rem}
.hero h1{font-size:clamp(2.1rem,9vw,3.6rem); margin:12px 0 6px; letter-spacing:.02em}
.hero .sub{margin:0; color:var(--muted)}
.hero-art{margin:12px -4px 4px}
.hero-art svg{display:block; width:100%; height:auto; overflow:visible}
.count-label{margin:6px 0 8px; font-weight:700}
.countdown{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.countbox{border:var(--thin); border-radius:var(--r-sm); padding:8px 4px; text-align:center; background:var(--paper)}
.countbox b{display:block; font-size:1.7rem; line-height:1.15; font-variant-numeric:tabular-nums}
.countbox span{font-size:.85rem; color:var(--muted)}
.countbox:nth-child(1){background:var(--yellow)}
.trip-now{border:var(--thin); border-radius:var(--r-sm); padding:12px; background:var(--green); font-weight:700; text-align:center}
.intro{margin:14px 0 0; padding-left:1.1em}
.intro li{margin:2px 0}

/* 標題 */
.sec-title{display:flex; align-items:center; gap:10px; font-size:1.45rem; margin:0 0 14px}
.sec-title i{width:20px; height:20px; border:var(--thin); border-radius:50%; flex:none}

/* 總覽 */
.overview{display:grid; gap:10px}
.ov{display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:var(--line); border-radius:var(--r-md); background:var(--card); padding:10px 12px; cursor:pointer}
.ov:active{transform:translateY(2px)}
.ov .date{flex:none; width:62px; height:62px; border:var(--thin); border-radius:var(--r-sm); display:grid; place-items:center; text-align:center; font-weight:700; line-height:1.1}
.ov .date small{display:block; font-size:.8rem; font-weight:400}
.ov b{display:block}
.ov span{color:var(--muted); font-size:.92rem}

/* 航班 */
.flights{display:grid; gap:12px}
.flight{border:var(--line); border-radius:var(--r-md); background:var(--card); padding:14px; position:relative; overflow:hidden}
.flight h3{font-size:1.15rem; display:flex; align-items:center; gap:8px}
.flight dl{margin:10px 0 0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px}
.flight dt{font-weight:700}
.flight dd{margin:0}
.todo-fill{color:var(--muted)}
.todo-fill span{border-bottom:2px dashed var(--pink)}
.flight .note{margin:10px 0 0; font-size:.9rem; color:var(--muted)}
.flight svg{position:absolute; right:12px; top:10px; width:44px; height:44px}

/* 每日行程 */
.tabs{position:sticky; top:var(--nav-h); z-index:20; background:var(--paper); display:flex; gap:8px; overflow-x:auto; padding:10px 0 12px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; border:var(--thin); border-radius:var(--r-sm); background:var(--card); padding:6px 12px; cursor:pointer; text-align:center; line-height:1.2; box-shadow:0 3px 0 var(--ink)}
.tab small{display:block; font-size:.78rem; color:var(--muted)}
.tab b{font-size:1.05rem}
.tab[aria-selected="true"]{background:var(--pink); transform:translateY(3px); box-shadow:none}
.tab[aria-selected="true"] small{color:var(--ink)}
.tab .today{display:block; font-size:.7rem; font-weight:700}
.day-head{display:flex; gap:12px; align-items:center; border:var(--line); border-radius:var(--r-lg); background:var(--card); padding:14px; margin:4px 0 14px}
.day-head svg{flex:none; width:76px; height:76px}
.day-head h3{font-size:1.3rem}
.day-head .day-date{margin:0 0 2px; color:var(--muted); font-size:.92rem; font-weight:700}
.route{border:2px dashed var(--ink); border-radius:var(--r-md); padding:10px 12px; background:var(--card); margin:0 0 10px}
.route b{display:block; font-size:.85rem}
.tip{border:var(--thin); border-radius:var(--r-md); padding:10px 12px; background:var(--blue); margin:0 0 16px; font-size:.95rem}
.panel.bounce{animation:bounce-in .55s cubic-bezier(.3,1.5,.5,1) both}
.panel.bounce .day-head svg{animation:wiggle .7s ease .1s both}
@keyframes bounce-in{0%{opacity:0; transform:translateY(18px) scale(.97)}60%{opacity:1; transform:translateY(-5px) scale(1.01)}100%{transform:none}}
@keyframes wiggle{0%{transform:scale(.6) rotate(-8deg)}55%{transform:scale(1.12) rotate(4deg)}100%{transform:none}}

.timeline{position:relative; padding-left:24px}
.timeline::before{content:""; position:absolute; left:7px; top:6px; bottom:6px; width:3px; border-radius:3px; background:var(--ink)}
.tl{position:relative; border:var(--line); border-radius:var(--r-md); background:var(--card); padding:12px 14px; margin:0 0 12px}
.tl::before{content:""; position:absolute; left:-25px; top:16px; width:12px; height:12px; border:3px solid var(--ink); border-radius:50%; background:var(--yellow)}
.tl.must{background:#FFF4F1}
.tl.must::before{background:var(--pink)}
.tl.meet::before{background:var(--green)}
.tl-time{font-weight:700; font-size:.95rem; color:var(--muted)}
.tl-place{font-size:1.12rem; margin:2px 0 0}
.tl p{margin:8px 0 0; white-space:pre-line}
.tl-heading{position:relative; margin:18px 0 12px -24px; border:var(--line); border-radius:var(--r-md); background:var(--yellow); padding:8px 14px; font-weight:700; font-size:1.08rem}
.tl-heading p{margin:4px 0 2px; font-weight:400; font-size:.92rem}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.tag{display:inline-flex; align-items:center; border:var(--thin); border-radius:999px; padding:0 10px; font-size:.82rem; font-weight:700; background:var(--card); line-height:1.75}
.tag.rail{background:var(--blue)} .tag.walk{background:var(--green)} .tag.car{background:var(--yellow)}
.tag.must{background:var(--pink)} .tag.meet{background:var(--yellow)} .tag.food{background:#FBE7B9} .tag.opt{background:var(--paper); border-style:dashed}
.groups{display:grid; gap:8px; margin-top:10px}
.group{border:var(--thin); border-radius:var(--r-sm); padding:10px 12px; background:var(--paper)}
.group b{display:block}
.group p{margin:4px 0 0}
.links{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px}
.links li{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px}
.pill{display:inline-flex; align-items:center; gap:4px; text-decoration:none; border:var(--thin); border-radius:999px; padding:2px 12px; background:var(--green); font-weight:700; font-size:.92rem}
.pill.web{background:var(--blue)}
.pill:active{transform:translateY(2px)}
.links small{color:var(--muted); font-size:.88rem}

/* 住宿、待辦 */
.two{display:grid; gap:12px}
.box{border:var(--line); border-radius:var(--r-md); background:var(--card); padding:16px}
.box h3{font-size:1.15rem; margin-bottom:6px}
.box ul{margin:6px 0 0; padding-left:1.2em}
.hotel{display:flex; gap:12px; align-items:flex-start}
.hotel svg{flex:none; width:64px}
.progress{font-weight:700; margin:-6px 0 12px}
.todo-list{display:grid; gap:8px; margin-top:8px}
.todo{display:flex; gap:10px; align-items:flex-start; border:var(--thin); border-radius:var(--r-sm); padding:9px 12px; background:var(--paper); cursor:pointer}
.todo input{flex:none; width:22px; height:22px; margin:2px 0 0; accent-color:var(--pink)}
.todo.done span{text-decoration:line-through; color:var(--muted)}
.small{font-size:.88rem; color:var(--muted)}

.footer{padding:24px 0 56px; text-align:center; color:var(--muted); font-size:.9rem}

/* 資料檔出錯時 */
.data-error{margin:16px 0; border:var(--line); border-radius:var(--r-md); background:#FFE9E4; padding:14px 16px}
.data-error h2{font-size:1.15rem; margin-bottom:6px}
.data-error code{background:var(--card); border:1px solid var(--ink); border-radius:6px; padding:0 4px}

/* 插圖小動畫 */
.a-bob{animation:bob 3.6s ease-in-out infinite}
.a-drift{animation:drift 9s ease-in-out infinite alternate}
.a-drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.a-train{animation:train 4s ease-in-out infinite}
.a-fly{animation:fly 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(14px)}}
@keyframes train{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}25%,75%{transform:translate(0,-1.5px)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(12px,-8px) rotate(2deg)}}

@media (min-width:720px){
  .overview{grid-template-columns:repeat(2,1fr)}
  .flights{grid-template-columns:repeat(3,1fr)}
  .two{grid-template-columns:1fr 1fr}
  .groups{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .hero-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:18px; align-items:center}
}
@media (min-width:980px){.overview{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>
</head>

            <path d="M252 154 L282 118 Q300 100 318 118 L348 154 L332 146 L318 160 L300 146 L284 160 L268 146 Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
            <!-- 鳥居 -->
            <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round">
              <path d="M440 200 Q470 194 500 200 L498 208 Q470 203 442 208 Z" fill="#F2A497"/>
              <rect x="446" y="214" width="48" height="6" fill="#F2A497"/>
              <path d="M452 206 V252 M488 206 V252" stroke-width="6"/>
            </g>
            <!-- 草地 -->
            <path d="M0 256 Q130 232 260 252 T520 248 L520 278 L0 278 Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
            <!-- 鐵軌與電車 -->
            <path d="M8 296 H512" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
            <g class="a-train">
              <rect x="70" y="262" width="88" height="28" rx="7" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
              <rect x="80" y="268" width="18" height="10" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/>
              <rect x="106" y="268" width="18" height="10" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/>
              <rect x="132" y="268" width="18" height="10" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/>
              <path d="M158 276 H166" stroke="#3E3A39" stroke-width="3"/>
              <path d="M166 262 H262 Q292 262 300 290 H166 Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
              <rect x="176" y="268" width="18" height="10" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/>
              <rect x="202" y="268" width="18" height="10" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/>
              <rect x="228" y="268" width="18" height="10" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/>
              <path d="M262 266 Q280 268 286 278 H262 Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M70 284 H300" stroke="#F2A497" stroke-width="3"/>
              <circle cx="88" cy="292" r="6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
              <circle cx="140" cy="292" r="6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
              <circle cx="186" cy="292" r="6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
              <circle cx="270" cy="292" r="6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
            </g>
          </svg>
        </div>
      </div>
      <p class="count-label" id="count-label">距離出發還有</p>
      <div id="count-area">
        <div class="countdown" role="timer" aria-label="出發倒數">
          <div class="countbox"><b id="cd-d">--</b><span>天</span></div>
          <div class="countbox"><b id="cd-h">--</b><span>時</span></div>
          <div class="countbox"><b id="cd-m">--</b><span>分</span></div>
          <div class="countbox"><b id="cd-s">--</b><span>秒</span></div>
        </div>
      </div>
      <ul class="intro" id="intro"></ul>
    </div>
  </section>

  <section id="overview">
    <h2 class="sec-title"><i style="background:var(--pink)"></i>六天總覽</h2>
    <div class="overview" id="overview-list"></div>
  </section>

  <section id="flights">
    <h2 class="sec-title"><i style="background:var(--blue)"></i>航班</h2>
    <div class="flights" id="flight-list"></div>
  </section>

  <section id="daily">
    <h2 class="sec-title"><i style="background:var(--green)"></i>每日行程</h2>
    <div class="tabs" id="tabs" role="tablist" aria-label="選擇日期"></div>
    <div id="panels"></div>
  </section>

  <section id="stay">
    <h2 class="sec-title"><i style="background:var(--yellow)"></i>住宿資訊</h2>
    <div class="two">
      <div class="box hotel">
        <svg aria-hidden="true"><use href="#ic-hotel"/></svg>
        <div>
          <h3 id="hotel-name"></h3>
          <p id="hotel-desc" style="margin:0"></p>
          <ul class="links"><li><a class="pill" id="hotel-map" target="_blank" rel="noopener">📍 開啟 Google Maps</a></li></ul>
        </div>
      </div>
      <div class="box">
        <h3>旅行規則</h3>
        <ul id="rules"></ul>
      </div>
    </div>
  </section>

  <section id="todo">
    <h2 class="sec-title"><i style="background:var(--pink)"></i>出發前待辦</h2>
    <p class="progress" id="todo-progress"></p>
    <div class="two" id="todo-groups"></div>
    <p class="small">打勾只記在你自己這支手機，不會同步給其他家人。</p>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <p id="footer-note" style="margin:0 0 6px"></p>
    <p style="margin:0">最後更新：<span id="updated">—</span></p>
  </div>
</footer>

<script>
(function () {
  "use strict";
  var dataError = null;

  // 行程內容檔有語法錯誤時，抓出第幾行，給改檔的人看
  window.addEventListener("error", function (e) {
    if (e.filename && e.filename.indexOf("trip-data.js") !== -1) {
      dataError = { line: e.lineno, message: e.message };
    }
  });

  // 加上時間參數，讓家人重新整理就拿到最新行程，不吃舊快取
  var s = document.createElement("script");
  s.src = "trip-data.js?v=" + Date.now();
  s.onload = function () {
    if (dataError || !window.TRIP) { showError(dataError); return; }
    try { render(window.TRIP); } catch (err) { showError({ message: String(err && err.message || err) }); }
  };
  s.onerror = function () { showError({ missing: true }); };
  document.head.appendChild(s);

  function showError(info) {
    info = info || {};
    var box = document.getElementById("data-error");
    var where = info.line ? "第 " + info.line + " 行附近" : "最近修改的地方";
    box.className = "data-error";
    box.hidden = false;
    box.innerHTML = "";
    box.appendChild(el("h2", null, info.missing ? "😵 找不到行程內容檔" : "😵 行程內容檔格式有誤"));
    if (info.missing) {
      box.appendChild(el("p", null, "請確認 trip-data.js 和 index.html 放在同一層資料夾，檔名一字不差。"));
    } else {
      box.appendChild(el("p", null, "請打開 trip-data.js，檢查" + where + "：引號是不是半形直引號 \"（不是 “ ” 或＂）、冒號和逗號是不是半形、每段結尾的逗號有沒有少。"));
      if (info.message) box.appendChild(el("p", { "class": "small" }, "瀏覽器的錯誤訊息：" + info.message));
      box.appendChild(el("p", { "class": "small" }, "改不回來的話，到 GitHub 的修改紀錄（History）把上一版的內容貼回來即可。"));
    }
  }

  /* ---------- 小工具 ---------- */
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function list(v) { return Array.isArray(v) ? v : []; }
  function store(get, key, val) {
    try {
      if (get) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, val);
    } catch (e) { return null; }
  }
  function mdLabel(iso) {
    var p = String(iso || "").split("-");
    return p.length === 3 ? Number(p[1]) + "/" + Number(p[2]) : String(iso || "");
  }
  function tokyoToday() {
    return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  }
  function transportClass(t) {
    if (/步行|散步|走/.test(t)) return "walk";
    if (/包車|計程車|巴士|公車|開車/.test(t)) return "car";
    return "rail";
  }
  var DAY_COLORS = ["var(--blue)", "var(--pink)", "var(--green)", "var(--yellow)"];
  var ICONS = { plane: 1, train: 1, fish: 1, lantern: 1, fuji: 1, suitcase: 1 };
  function icon(name, cls) {
    var id = ICONS[name] ? name : "plane";
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("aria-hidden", "true");
    if (cls) svg.setAttribute("class", cls);
    var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#ic-" + id);
    svg.appendChild(use);
    return svg;
  }
  function linkList(links) {
    var ul = el("ul", { "class": "links" });
    list(links).forEach(function (l) {
      if (!l || !l[1]) return;
      var li = el("li");
      var isMap = /google\.[^/]+\/maps|maps\.app\.goo\.gl/.test(l[1]);
      var a = el("a", { "class": isMap ? "pill" : "pill web", href: l[1], target: "_blank", rel: "noopener" },
        (isMap ? "📍 " : "🔗 ") + (l[0] || "連結"));
      li.appendChild(a);
      if (l[2]) li.appendChild(el("small", null, l[2]));
      ul.appendChild(li);
    });
    return ul.children.length ? ul : null;
  }
  function tagRow(item) {
    var row = el("div", { "class": "tags" });
    if (item.必去) row.appendChild(el("span", { "class": "tag must" }, "★ 必去"));
    if (item.集合) row.appendChild(el("span", { "class": "tag meet" }, "⏰ 集合"));
    if (item.美食) row.appendChild(el("span", { "class": "tag food" }, "🍚 用餐"));
    if (item.自選) row.appendChild(el("span", { "class": "tag opt" }, "自選"));
    list(item.交通).forEach(function (t) {
      row.appendChild(el("span", { "class": "tag " + transportClass(t) }, t));
    });
    return row.children.length ? row : null;
  }

  /* ---------- 畫面 ---------- */
  function render(T) {
    var days = list(T.天數);

    if (T.公告) {
      document.getElementById("notice-text").textContent = T.公告;
      document.getElementById("notice").hidden = false;
    }
    if (T.標題) document.getElementById("title").textContent = T.標題;
    if (T.副標) document.getElementById("subtitle").textContent = T.副標;
    var intro = document.getElementById("intro");
    list(T.說明).forEach(function (t) { intro.appendChild(el("li", null, t)); });
    document.getElementById("updated").textContent = T.更新日期 || "—";
    document.getElementById("footer-note").textContent = T.頁尾 || "";

    // 總覽
    var ov = document.getElementById("overview-list");
    days.forEach(function (d, i) {
      var b = el("button", { "class": "ov", type: "button" });
      var date = el("span", { "class": "date" });
      date.style.background = DAY_COLORS[i % DAY_COLORS.length];
      date.appendChild(document.createTextNode(mdLabel(d.日期)));
      date.appendChild(el("small", null, "（" + (d.星期 || "") + "）"));
      var txt = el("span");
      txt.appendChild(el("b", null, d.標題 || ""));
      txt.appendChild(el("span", null, d.人數 || ""));
      b.appendChild(date); b.appendChild(txt);
      b.addEventListener("click", function () { selectDay(i, true); });
      ov.appendChild(b);
    });

    // 航班
    var fl = document.getElementById("flight-list");
    list(T.航班).forEach(function (f) {
      var card = el("div", { "class": "flight" });
      card.appendChild(icon("plane"));
      card.appendChild(el("h3", null, "✈ " + (f.組別 || "")));
      var dl = el("dl");
      [["去程", f.去程], ["回程", f.回程]].forEach(function (r) {
        dl.appendChild(el("dt", null, r[0]));
        var dd = el("dd");
        dd.appendChild(el("span", null, r[1] || "待填"));
        if (/待填/.test(r[1] || "待填")) dd.className = "todo-fill";
        dl.appendChild(dd);
      });
      card.appendChild(dl);
      if (f.備註) card.appendChild(el("p", { "class": "note" }, f.備註));
      fl.appendChild(card);
    });

    // 每日行程
    var tabs = document.getElementById("tabs");
    var panels = document.getElementById("panels");
    var today = tokyoToday();
    days.forEach(function (d, i) {
      var tab = el("button", { "class": "tab", type: "button", role: "tab", id: "tab-" + i,
        "aria-controls": "panel-" + i, "aria-selected": "false", tabindex: "-1" });
      tab.appendChild(el("small", null, "Day " + (i + 1)));
      tab.appendChild(el("b", null, mdLabel(d.日期) + "（" + (d.星期 || "") + "）"));
      if (d.日期 === today) tab.appendChild(el("span", { "class": "today" }, "今天"));
      tab.addEventListener("click", function () { selectDay(i, false); });
      tabs.appendChild(tab);

      var p = el("div", { "class": "panel", role: "tabpanel", id: "panel-" + i, "aria-labelledby": "tab-" + i });
      p.hidden = true;
      var head = el("div", { "class": "day-head" });
      head.appendChild(icon(d.插圖));
      var ht = el("div");
      ht.appendChild(el("p", { "class": "day-date" }, mdLabel(d.日期) + "（" + (d.星期 || "") + "）" + (d.人數 ? "・" + d.人數 : "")));
      ht.appendChild(el("h3", null, d.標題 || ""));
      head.appendChild(ht);
      p.appendChild(head);
      if (d.路線) {
        var route = el("div", { "class": "route" });
        route.appendChild(el("b", null, "今日動線"));
        route.appendChild(document.createTextNode(d.路線));
        p.appendChild(route);
      }
      if (d.提醒) p.appendChild(el("div", { "class": "tip" }, "💡 " + d.提醒));

      var tl = el("div", { "class": "timeline" });
      list(d.行程).forEach(function (it) {
        if (!it) return;
        if (it.小標題) {
          var h = el("div", { "class": "tl-heading" }, it.小標題);
          if (it.說明) h.appendChild(el("p", null, it.說明));
          tl.appendChild(h);
          return;
        }
        var cls = "tl" + (it.必去 ? " must" : "") + (it.集合 ? " meet" : "");
        var card = el("article", { "class": cls });
        if (it.時間) card.appendChild(el("div", { "class": "tl-time" }, it.時間));
        if (it.地點) card.appendChild(el("h4", { "class": "tl-place" }, it.地點));
        var tags = tagRow(it); if (tags) card.appendChild(tags);
        if (it.說明) card.appendChild(el("p", null, it.說明));
        var gs = list(it.分組);
        if (gs.length) {
          var g = el("div", { "class": "groups" });
          gs.forEach(function (x) {
            var gb = el("div", { "class": "group" });
            gb.appendChild(el("b", null, x.名稱 || ""));
            var gt = tagRow(x); if (gt) gb.appendChild(gt);
            if (x.內容) gb.appendChild(el("p", { style: "white-space:pre-line" }, x.內容));
            var gl = linkList(x.連結); if (gl) gb.appendChild(gl);
            g.appendChild(gb);
          });
          card.appendChild(g);
        }
        var ll = linkList(it.連結); if (ll) card.appendChild(ll);
        tl.appendChild(card);
      });
      p.appendChild(tl);
      panels.appendChild(p);
    });

    tabs.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      var cur = Number((document.activeElement.id || "").replace("tab-", ""));
      if (isNaN(cur)) return;
      var next = (cur + (e.key === "ArrowRight" ? 1 : -1) + days.length) % days.length;
      selectDay(next, false);
      document.getElementById("tab-" + next).focus();
    });

    var start = days.findIndex ? days.findIndex(function (d) { return d.日期 === today; }) : -1;
    selectDay(start >= 0 ? start : 0, false, true);

    // 住宿
    var stay = T.住宿 || {};
    document.getElementById("hotel-name").textContent = stay.名稱 || "";
    document.getElementById("hotel-desc").textContent = stay.說明 || "";
    var hm = document.getElementById("hotel-map");
    if (stay.地圖) hm.href = stay.地圖; else hm.parentNode.hidden = true;
    var rules = document.getElementById("rules");
    list(T.旅行規則).forEach(function (r) { rules.appendChild(el("li", null, r)); });

    // 待辦
    var groups = document.getElementById("todo-groups");
    var all = [];
    list(T.待辦).forEach(function (grp) {
      var box = el("div", { "class": "box" });
      box.appendChild(el("h3", null, grp.分類 || ""));
      var tlist = el("div", { "class": "todo-list" });
      list(grp.項目).forEach(function (text) {
        var key = "tokyo2026:todo:" + text;
        var lab = el("label", { "class": "todo" });
        var cb = el("input", { type: "checkbox" });
        cb.checked = store(true, key) === "1";
        lab.classList.toggle("done", cb.checked);
        cb.addEventListener("change", function () {
          store(false, key, cb.checked ? "1" : "0");
          lab.classList.toggle("done", cb.checked);
          progress();
        });
        lab.appendChild(cb);
        lab.appendChild(el("span", null, text));
        tlist.appendChild(lab);
        all.push(cb);
      });
      box.appendChild(tlist);
      groups.appendChild(box);
    });
    function progress() {
      var done = all.filter(function (c) { return c.checked; }).length;
      document.getElementById("todo-progress").textContent = "已完成 " + done + "／" + all.length + (done === all.length && all.length ? " 🎉" : "");
    }
    progress();

    startCountdown(T.出發時間, T.結束時間);
  }

  /* ---------- 切換日期 ---------- */
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function selectDay(i, fromOverview, initial) {
    var tabs = document.querySelectorAll(".tab");
    var panels = document.querySelectorAll(".panel");
    if (!tabs[i]) return;
    for (var k = 0; k < tabs.length; k++) {
      var on = k === i;
      tabs[k].setAttribute("aria-selected", on ? "true" : "false");
      tabs[k].setAttribute("tabindex", on ? "0" : "-1");
      panels[k].hidden = !on;
      panels[k].classList.remove("bounce");
    }
    if (!initial) {
      void panels[i].offsetWidth;  // 重新觸發彈跳動畫
      panels[i].classList.add("bounce");
    }
    tabs[i].scrollIntoView({ block: "nearest", inline: "center", behavior: reduceMotion || initial ? "auto" : "smooth" });
    if (initial) return;
    var navH = document.getElementById("topbar").offsetHeight;
    var tabsBox = document.getElementById("tabs");
    var daily = document.getElementById("daily");
    var target = daily.getBoundingClientRect().top + window.pageYOffset - navH;
    var tabsTop = tabsBox.getBoundingClientRect().top;
    if (fromOverview || tabsTop <= navH + 1) {
      window.scrollTo({ top: target, behavior: reduceMotion ? "auto" : "smooth" });
    }
  }

  /* ---------- 倒數 ---------- */
  function startCountdown(startIso, endIso) {
    var start = new Date(startIso || "2026-12-03T00:00:00+09:00").getTime();
    var end = new Date(endIso || "2026-12-08T23:59:59+09:00").getTime();
    var ids = ["cd-d", "cd-h", "cd-m", "cd-s"].map(function (id) { return document.getElementById(id); });
    var timer;
    function tick() {
      var now = Date.now();
      if (now >= start) {
        clearInterval(timer);
        var area = document.getElementById("count-area");
        document.getElementById("count-label").hidden = true;
        area.innerHTML = "";
        area.appendChild(el("div", { "class": "trip-now" }, now <= end ? "🎉 旅行進行中！往下看今天的行程" : "📷 旅行結束，謝謝大家一起出遊！"));
        return;
      }
      var diff = start - now;
      var d = Math.floor(diff / 86400000); diff %= 86400000;
      var h = Math.floor(diff / 3600000); diff %= 3600000;
      var m = Math.floor(diff / 60000); diff %= 60000;
      var sec = Math.floor(diff / 1000);
      ids[0].textContent = d;
      ids[1].textContent = String(h).padStart(2, "0");
      ids[2].textContent = String(m).padStart(2, "0");
      ids[3].textContent = String(sec).padStart(2, "0");
    }
    tick();
    timer = setInterval(tick, 1000);
  }

  // 讓每日分頁黏在選單下方
  function syncNavH() {
    var h = document.getElementById("topbar").offsetHeight;
    document.documentElement.style.setProperty("--nav-h", h + "px");
  }
  syncNavH();
  window.addEventListener("resize", syncNavH);
})();
</script>
</body>
</html>
